name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/tui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/tui
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo clippy --locked --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features full
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install optional extension test dependency
        working-directory: ui/tui/pi-extensions
        run: bun install --ignore-scripts
      - name: Fetch pinned upstream Pi extension contracts
        run: |
          git init "$RUNNER_TEMP/pi-contracts"
          git -C "$RUNNER_TEMP/pi-contracts" fetch --depth=1 https://github.com/earendil-works/pi.git d4d188646c6bbd5d103238cbd05f1e5c01feb9e4
          git -C "$RUNNER_TEMP/pi-contracts" checkout --detach FETCH_HEAD
      - name: Execute real Pi JavaScript extensions
        env:
          TK_PI_TEST_BUN: bun
          TK_PI_TEST_TYPEBOX: ${{ github.workspace }}/ui/tui/pi-extensions/typebox.mjs
          TK_PI_TEST_UPSTREAM: ${{ runner.temp }}/pi-contracts
          DO_NOT_TRACK: "1"
        run: cargo test --locked --features full pi::extensions::tests -- --include-ignored --nocapture
      - run: cargo build --locked
      - name: PGO scripts parse
        working-directory: ${{ github.workspace }}
        run: |
          bash -n scripts/pgo/pgo.sh
          bash -n scripts/pgo/train.sh
          bash scripts/pgo/pgo.sh --help >/dev/null
      - name: Default tree excludes Praefectus
        run: |
          if cargo tree -p telekinesis --locked -i praefectus >/tmp/praefectus-tree 2>/tmp/praefectus-err; then
            echo "default features must not depend on praefectus"
            cat /tmp/praefectus-tree
            exit 1
          fi
      - name: Default tree excludes darash
        run: |
          if cargo tree -p telekinesis --locked -i darash >/tmp/darash-tree 2>/tmp/darash-err; then
            echo "default features must not depend on darash"
            cat /tmp/darash-tree
            exit 1
          fi
      - name: Default tree does not enable rx4/mcp
        run: |
          if cargo tree -p telekinesis --locked -e features -i rx4 | grep -F 'rx4 feature "mcp"'; then
            echo "default features must not enable rx4/mcp"
            cargo tree -p telekinesis --locked -e features -i rx4
            exit 1
          fi
      - name: Default tree excludes OpenSSL native-tls
        run: |
          if cargo tree -p telekinesis --locked -i openssl >/tmp/openssl-tree 2>/tmp/openssl-err; then
            echo "default features must not depend on openssl"
            cat /tmp/openssl-tree
            exit 1
          fi

  router:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/router
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/router
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AVO adapters
        run: scripts/check-avo-adapters.sh
      - name: AVO loop
        run: scripts/check-avo-loop.sh

  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/gui
      - run: cargo fmt --check
      - run: cargo clippy --locked --lib --no-default-features -- -D warnings
      - run: cargo test --locked --lib --no-default-features
      - run: cargo check --locked --lib --no-default-features
      - name: GUI host keeps rx4 default-features off
        run: |
          if cargo tree -p telekinesis-gui --locked --no-default-features -e features -i rx4 | grep -F 'rx4 feature "mcp"'; then
            echo "gui host must not enable rx4/mcp"
            cargo tree -p telekinesis-gui --locked --no-default-features -e features -i rx4
            exit 1
          fi
          if cargo tree -p telekinesis-gui --locked --no-default-features -e features -i rx4 | grep -F 'rx4 feature "skills"'; then
            echo "gui host must not enable rx4/skills"
            exit 1
          fi
